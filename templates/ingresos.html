<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSpotter — Ingresos</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos_garajes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos_cuenta.css') }}">
</head>
<body>

    <header class="garaje-nav">
        <a href="{{ url_for('mis_garajes') }}" class="garaje-nav__logo">Park<span>Spotter</span></a>
    </header>

    <main class="garaje-page">
        <div class="garaje-list-header">
            <h1 class="garaje-title">Ingresos</h1>
            <p class="garaje-subtitle">Ganancias generadas por tus garajes</p>
        </div>

        <div class="ingresos-resumen">
            <div class="ingresos-resumen__item">
                <small>Total ganado</small>
                <strong id="total-ganado">$0</strong>
            </div>
            <div class="ingresos-resumen__item">
                <small>Reservas recibidas</small>
                <strong id="total-reservas">0</strong>
            </div>
        </div>

        <div id="ingresos-list"></div>

        <div class="empty-state" id="ingresos-empty" hidden>
            <ion-icon name="cash-outline"></ion-icon>
            <h2>Aún no tienes ingresos</h2>
            <p>Cuando alguien reserve uno de tus garajes, verás el detalle aquí.</p>
            <a href="{{ url_for('mis_garajes') }}" class="garaje-btn garaje-btn--primary">Ver mis garajes</a>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="{{ url_for('mis_garajes') }}" class="bottom-nav__item">
            <ion-icon name="business-outline"></ion-icon>
            <p>Mis garajes</p>
        </a>
        <a href="{{ url_for('publicar_garaje') }}" class="bottom-nav__item">
            <ion-icon name="add-circle-outline"></ion-icon>
            <p>Publicar</p>
        </a>
        <a href="{{ url_for('ingresos') }}" class="bottom-nav__item bottom-nav__item--active">
            <ion-icon name="cash-outline"></ion-icon>
            <p>Ingresos</p>
        </a>
        <a href="{{ url_for('mi_cuenta') }}" class="bottom-nav__item">
            <ion-icon name="person-outline"></ion-icon>
            <p>Mi cuenta</p>
        </a>
    </nav>

    <script src="{{ url_for('static', filename='js/ingresos.js') }}"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
