<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSpotter — Mis garajes</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/normalize.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos_garajes.css') }}">
</head>
<body>

    <header class="garaje-nav">
        <a href="{{ url_for('landing') }}" class="garaje-nav__logo">Park<span>Spotter</span></a>
        <a href="{{ url_for('publicar_garaje') }}" class="garaje-nav__link garaje-nav__link--cta">
            <ion-icon name="add-outline"></ion-icon>
            Publicar garaje
        </a>
    </header>

    <main class="garaje-page">
        <div class="garaje-list-header">
            <h1 class="garaje-title">Mis garajes</h1>
            <p class="garaje-subtitle">Administra los espacios que has publicado</p>
        </div>

        <div class="garaje-grid" id="garaje-grid">
            <!-- Las tarjetas se generan dinámicamente con JS -->
        </div>

        <div class="garaje-empty" id="garaje-empty" hidden>
            <ion-icon name="car-outline"></ion-icon>
            <h3>Aún no has publicado ningún garaje</h3>
            <p>Empieza a generar ingresos publicando tu primer espacio.</p>
            <a href="{{ url_for('publicar_garaje') }}" class="garaje-btn garaje-btn--primary">Publicar mi primer garaje</a>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/garajes.js') }}"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

        <nav class="bottom-nav">
        <a href="{{ url_for('mis_garajes') }}" class="bottom-nav__item bottom-nav__item--active">
            <ion-icon name="business-outline"></ion-icon>
            <p>Mis garajes</p>
        </a>
        <a href="{{ url_for('publicar_garaje') }}" class="bottom-nav__item">
            <ion-icon name="add-circle-outline"></ion-icon>
            <p>Publicar</p>
        </a>
        <a href="#" class="bottom-nav__item">
            <ion-icon name="cash-outline"></ion-icon>
            <p>Ingresos</p>
        </a>
        <a href="{{ url_for('mi_cuenta') }}" class="bottom-nav__item">
            <ion-icon name="person-outline"></ion-icon>
            <p>Mi cuenta</p>
        </a>
    </nav>
</body>
</html>
